<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARQTEMIX - Datos de Reservorios</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="../CSS/datos.css">
    <link rel="shortcut icon" href="./images/Logo ARQTEMIX.ico" type="image/x-icon">
</head>
<body>

    <header>
        <div class="cabezal">
            <a href="login.html">
                <img src="../images/LOGO_UNI-removebg-preview.png" alt="Logo de UNI" class="logo" id="uni">
            </a>
            
            <img src="../images/LOGO IDEA.png" alt="Logo Aqua Verde" class="logo-aqua">
        
            <div class="user-nav-container">
                <span class="user-welcome">AdminSINAPRED</span>
                <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
            </div>
        </div>
    </header>

    <main>
        <div class="map-container">
            <h2>Mapa Interactivo de Reservorios Pluviales</h2>
            <div id="map"></div>
        </div>

        <section class="image-section">
            <h2>Ubicación Seleccionada</h2>
            <div class="info-content" id="image-container">
                <p>Selecciona un marcador en el mapa para ver la imagen del reservorio.</p>
            </div>
        </section>

        <section class="info-section">
            <h2>Información Técnica</h2>
            <div class="info-content" id="info-container">
                <p>Selecciona un marcador para ver los detalles y coordenadas del sitio.</p>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="../JS/datos.js"></script>
</body>
</html>
