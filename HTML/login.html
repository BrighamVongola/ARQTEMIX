<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login.css">
    <title>Arqtemix Login</title>
</head>
<body>
    <header>
        <div class="cabezal">
            <a href="../index.html">
                <img src="../images/LOGO_UNI-removebg-preview.png" alt="Logo de UNI" class="logo">
            </a>
            <h1>ARQTEMIX</h1>
            <a href="../index.html">
                <img src="../images/Logo ARQTEMIX.jpeg" alt="Logo Arqtemix" class="logo">
            </a>
        </div>
    </header>

    <main class="login-main-wrapper">
        <!-- Botón para volver al Inicio -->
        <div class="back-home-container">
            <a href="../index.html" class="btn-back-home">← Volver al Inicio</a>
        </div>

        <div class="login-container">
            <div class="form-tabs">
                <button type="button" id="tab-login" class="tab-btn active">Iniciar Sesión</button>
                <button type="button" id="tab-register" class="tab-btn">Registrarse</button>
            </div>

            <h2 id="form-title">Iniciar Sesión</h2>

            <!-- Formulario corregido con id="login-form" -->
            <form id="login-form">
                <div class="input-group">
                    <label for="username" id="label-username">Usuario:</label>
                    <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
                </div>

                <div class="input-group hidden" id="group-email">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                </div>

                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" id="btn-submit" class="btn-primary">Ingresar</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ARQTEMIX. Todos los derechos reservados.</p>
    </footer>

    <!-- Carga del JS -->
    <script src="../JS/login.js"></script>
</body>
</html>
