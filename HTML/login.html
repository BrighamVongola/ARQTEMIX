<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login.css">
    <title>Arqtemix Login</title>
    <!-- Google Identity Services API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <header>
        <div class="cabezal">
            <img src="../images/LOGO_UNI-removebg-preview.png" alt="Logo de UNI" class="logo">
            <h1>ARQTEMIX</h1>
            <img src="../images/Logo ARQTEMIX.jpeg" alt="Logo Arqtemix" class="logo">
        </div>
    </header>

    <main>
        <div class="login-container">
            <!-- Pestañas de Navegación -->
            <div class="form-tabs">
                <button type="button" id="tab-login" class="tab-btn active" onclick="mostrarModo('login')">Iniciar Sesión</button>
                <button type="button" id="tab-register" class="tab-btn" onclick="mostrarModo('register')">Registrarse</button>
            </div>

            <h2 id="form-title">Iniciar Sesión</h2>

            <form id="auth-form" action="login.php" method="POST" onsubmit="manejarAutenticacion(event)">
                
                <!-- Campo de Nombre de Usuario / Nombre Completo -->
                <div class="input-group">
                    <label for="username" id="label-username">Usuario:</label>
                    <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
                </div>

                <!-- Campo adicional para Registro (Correo Electrónico) -->
                <div class="input-group hidden" id="group-email">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                </div>

                <!-- Campo de Contraseña -->
                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" id="btn-submit" class="btn-primary">Ingresar</button>
            </form>

            <!-- Separador -->
            <div class="divider">
                <span>ó</span>
            </div>

            <!-- Sección de Registro / Login con Google -->
            <div class="google-section">
                <p id="google-text">Continuar con Google:</p>
                <div id="g_id_onload"
                     data-client_id="TU_CLIENT_ID_DE_GOOGLE.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin" 
                     data-type="standard" 
                     data-size="large" 
                     data-theme="dark" 
                     data-text="continue_with" 
                     data-shape="rect" 
                     data-logo_alignment="left">
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 ARQTEMIX. Todos los derechos reservados.</p>
    </footer>

    <!-- Script de lógica de Autenticación -->
    <script src="../JS/login.js"></script>
</body>
</html>
